<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

.top{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;justify-content:space-between;margin-bottom:1rem}

input,select{border:1px solid var(--line);border-radius:12px;padding:.35rem .6rem;background:#fff;max-width:100%}input[type=number]{width:5rem}

.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.grid .card{margin:0}
.layout{display:grid;gap:1rem;grid-template-columns:2fr 1fr}@media(max-width:800px){.layout{grid-template-columns:1fr}}
.emoji{font-size:2rem;border-radius:14px;display:inline-block;padding:.25rem .55rem;margin-bottom:.3rem}
.Snacks .emoji{background:var(--peach)}.Meals .emoji{background:var(--mint)}.Beverages .emoji{background:var(--sky)}
.muted{color:var(--muted);font-size:.88rem}.pill{border-radius:999px;padding:.1rem .6rem;font-size:.8rem;display:inline-block}
.Placed{background:var(--lemon)}.Preparing{background:var(--peach)}.Ready{background:var(--mint)}.Completed{background:var(--sky)}

.stats{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:1rem}.stats .card{margin:0}.stats b{display:block;font-size:1.5rem}
.tw{overflow-x:auto;max-height:420px}table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{padding:.35rem .55rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#fff}.two{display:grid;gap:1rem;grid-template-columns:1fr 1fr}@media(max-width:800px){.two{grid-template-columns:1fr}}
.box{background:var(--bg);border-radius:12px;padding:.6rem .9rem}
.sch{display:block;font-size:.8rem;font-weight:600;color:var(--or);letter-spacing:.04em;text-transform:uppercase}
.hero{max-width:720px;margin:6vh auto;text-align:center;padding:2rem}.hero h1{font-size:2.6rem;margin:.3rem 0;color:var(--ac)}.sub{font-size:1.1rem;margin:0 0 1rem}
.ctl{display:block;margin-bottom:.6rem}.ctl select,.ctl input[type=number]{width:100%}.ctl input[type=range]{width:100%;accent-color:var(--ac)}
.warnbox{background:var(--rose);border-left:5px solid var(--or);border-radius:10px;padding:.6rem .9rem;margin:.6rem 0}
.good{color:var(--ac);font-weight:600}.bad2{color:var(--or);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--or);outline-offset:2px}
body.pres{font-size:1.12rem}
@media print{.noprint,.msg,button{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}

.banner{position:sticky;top:0;z-index:30;background:#fff1c9;border-bottom:3px solid var(--or);color:#2b302c;font-weight:600;padding:.6rem 1rem;font-size:.95rem;line-height:1.35}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.7rem;align-items:start;margin-bottom:.8rem}
.seg{display:flex;border:2px solid var(--ac);border-radius:999px;overflow:hidden;background:#fff;justify-self:end}
.seg button{border-radius:0;background:#fff;color:var(--ac);font-weight:600;padding:.5rem 1rem;white-space:nowrap}
.seg button.act{background:var(--ac);color:#fff}

@media(max-width:520px){.seg button{padding:.4rem .6rem;font-size:.82rem}.brand{font-size:1.25rem}.banner{font-size:.86rem;padding:.5rem .7rem}}
.cal{margin:.4rem 0}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-top:.3rem}.calgrid small{color:var(--muted);font-weight:600}
.day{border-radius:10px;padding:.3rem 0;min-height:2.3rem;min-width:0;background:#fff;border:1px solid var(--line)}
.day.today{border-color:var(--or);box-shadow:inset 0 0 0 1px var(--or)}.day.sel{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.day:disabled{background:#f0ece0;color:#8d8873;text-decoration:line-through}
.oos{opacity:.65}.oos .emoji{filter:grayscale(1)}.stk-in{background:var(--mint)}.stk-out{background:var(--rose);color:#7a3600}
</style></head><body>
<div class="banner" role="note">Demonstration system: simulated data, no real payments. A student project, not an official school system. Data is saved only in this browser on this computer</div>
<div class="wrap" id="app"></div>
<script>
"use strict";
const DAYS=["Mon","Tue","Wed","Thu","Fri"],KEY="canteeniq-html-v1";
const MENU0=[
{id:"chocolate",name:"Chocolate",desc:"Milk chocolate bar (demonstration item)",price:10,cat:"Snacks",emoji:"🍫",prep:30},
{id:"samosa",name:"Veg Samosa",desc:"Crispy potato and pea filling",price:15,cat:"Snacks",emoji:"🥟",prep:0},
{id:"sandwich",name:"Cheese Sandwich",desc:"Toasted, with mint chutney",price:30,cat:"Snacks",emoji:"🥪",prep:0},
{id:"pulao",name:"Veg Pulao Bowl",desc:"Rice, vegetables and raita",price:50,cat:"Meals",emoji:"🍚",prep:0},
{id:"juice",name:"Fresh Fruit Juice",desc:"Seasonal fruit, no added sugar",price:25,cat:"Beverages",emoji:"🧃",prep:0},
{id:"cookie",name:"Millet Cookies",desc:"Pack of two, baked",price:20,cat:"Snacks",emoji:"🍪",prep:0}];
// FICTIONAL hand-written data. 15 history sessions (3 weeks Mon-Fri); index 14 = Sports Day event.
const HD={samosa:[30,26,24,28,40,32,25,23,30,42,29,27,25,27,52],sandwich:[22,25,21,20,28,24,23,22,21,27,23,26,20,22,33],
pulao:[35,30,33,31,38,36,31,32,30,37,34,32,31,33,45],juice:[18,20,22,25,30,19,21,23,24,31,20,22,21,26,38],cookie:[12,14,13,15,18,13,12,14,16,17,14,13,15,14,24]};
// Separate labelled TEST week, never used to train the forecast (cookies Wednesday is a deliberate surprise)
const TD={samosa:[31,27,24,29,41],sandwich:[24,24,22,21,29],pulao:[36,30,34,32,39],juice:[21,22,22,27,31],cookie:[13,15,22,16,19]};
const FIX={samosa:35,sandwich:28,pulao:40,juice:28,cookie:18};
const SLOTS=["Short break (9:50–10:00 am)","Lunch break (1:00–1:30 pm)"];
const dt=i=>new Date(Date.UTC(2026,8,7+Math.floor(i/5)*7+i%5)).toISOString().slice(0,10);
function mk(t,off,evs,rate){const r=[];for(const id in t)t[id].forEach((d,i)=>{const p=FIX[id],u=Math.max(0,p-d);r.push({date:dt(off+i),day:DAYS[i%5],id,prep:p,dem:d,disc:Math.round(u*rate),est:true,ev:evs.includes(off+i),type:evs.includes(off+i)?"event":"normal"})});return r}
const pad=n=>String(n).padStart(2,"0");
function isoOf(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function todayISO(){return isoOf(new Date())}
function maxISO(){const n=new Date(),nm=new Date(n.getFullYear(),n.getMonth()+1,1),last=new Date(nm.getFullYear(),nm.getMonth()+1,0).getDate();return isoOf(new Date(nm.getFullYear(),nm.getMonth(),Math.min(n.getDate(),last)))} /* same day next month, clamped to month end */
function freshMenu(){return MENU0.map(m=>({...m,stock:m.prep,on:true}))}
function fresh(){return{menu:freshMenu(),hist:mk(HD,0,[14],.6),test:mk(TD,15,[],.6),orders:[],
role:"student",pin:"1234",menuVer:2,cfg:{classes:["VI","VII","VIII","IX","X","XI","XII"],sections:["A","B","C","D"]},cls:"",sec:"",od:todayISO(),cal:null,last:null,plan:{...FIX},intro:true,pres:false,dtype:"normal",fm:{method:"hybrid",k:3,dayOnly:true,buf:5},adj:{exam:0,short:0,event:0},sim:{id:"samosa",day:"Mon",type:"normal",att:100,adj:0,base:35,prep:35,cost:12,budget:500},set:{minItem:1.5,perOrder:1,disc:.6,cost:12,co2:0},date:"2026-10-05",next:1001,ev:false,tab:"student",cart:{},msg:null,cat:"All",q:"",nm:"",sl:"",fi:"samosa",fd:"Mon",pd:"Mon",lk:""}}
let S,saveFail=false,loadWarn="";
try{const raw=localStorage.getItem(KEY),p=raw?JSON.parse(raw):null;if(p&&(!Array.isArray(p.hist)||!Array.isArray(p.menu)||!Array.isArray(p.orders)))throw new Error("bad");S=Object.assign(fresh(),p||{});
 if(p&&p.menuVer!==2){S.menu=freshMenu();S.menuVer=2;S.msg={k:"good",t:"Demonstration menu applied once: Chocolate is in stock and every other item is out of stock. Your history and settings were kept. Change this in Authority View > Staff."}}
 S.orders.forEach(o=>{if(!o.odate)o.odate=todayISO()});if(!S.cfg||!Array.isArray(S.cfg.classes)||!Array.isArray(S.cfg.sections))S.cfg=fresh().cfg}
catch(e){loadWarn="Saved data could not be read, so sample data was loaded. A backup copy of the unreadable data was kept in this browser.";try{localStorage.setItem(KEY+"-backup",localStorage.getItem(KEY)||"")}catch(_){}S=fresh()}
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0,sdev=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const dayOf=iso=>DAYS[(new Date(iso+"T00:00:00Z").getUTCDay()+6)%7]||"Mon";
const nw=iso=>{const d=new Date(iso+"T00:00:00Z");do d.setUTCDate(d.getUTCDate()+1);while(d.getUTCDay()%6===0);return d.toISOString().slice(0,10)};
const nameOf=id=>S.menu.find(m=>m.id===id).name;

/* FORECASTING: deterministic (same data + settings -> same number). Only NORMAL days feed the averages. */
const MN={avg:"A. Simple average",ma:"B. Moving average",wma:"C. Weighted moving average",hybrid:"CanteenIQ hybrid (weekday + moving average)"};
const MEXP={avg:"Average of all chosen past values. Simple and steady, but slow to notice a new trend.",ma:"Average of only the last k values, so it follows recent changes.",wma:"Like B, but newer values count more (weights 1, 2, 3 … k; newest has the largest weight).",hybrid:"Average of the same-weekday average and the last-3 moving average (the original CanteenIQ method)."};
const DTYPES=[["normal","Normal school day"],["exam","Examination day"],["short","Shortened / holiday-adjusted day"],["event","Special event (sports day, function, festival)"]];
const tr=r=>S.hist.filter(x=>x.date<r.date); /* training rows: strictly BEFORE the evaluated date */
function dayAdj(h,id,type){ /* applied exactly once per forecast: data-based ratio if past rows exist, else manual % */
 if(type==="normal")return{k:1,txt:"Normal day: no day-type adjustment."};
 const rows=h.filter(x=>x.id===id&&x.ev&&(x.type||"event")===type),nm=h.filter(x=>x.id===id&&!x.ev),
  mn=mean(rows.map(e=>{const q=nm.filter(x=>x.day===e.day);return mean((q.length?q:nm).map(x=>x.dem))})); /* compare each event day with normal days of the SAME weekday, so the weekday effect is not counted twice */
 if(rows.length&&mn>0)return{k:mean(rows.map(x=>x.dem))/mn,txt:`Day-type adjustment from ${rows.length} past ${type} row(s): few samples, unreliable.`};
 const pc=(S.adj&&+S.adj[type])||0;return{k:1+pc/100,txt:`No past ${type} data, so your manual adjustment (${pc}%) is used.`}}
function fc(h,id,day,type,on=true,o){
 o=o||S.fm;type=type===true?"event":(type||"normal");
 const rows=h.filter(x=>x.id===id&&Number.isFinite(x.dem)&&x.dem>=0).sort((a,b)=>a.date<b.date?-1:1),nm=rows.filter(x=>!x.ev),none=(v,m,st)=>({v,lo:v,hi:v,n:rows.length,conf:"insufficient",method:m,steps:st});
 if(!on)return none(0,"Item switched off",["Item unavailable, so forecast demand is 0."]);
 if(nm.length<3){const v=Math.round(mean(nm.map(x=>x.dem)));return none(v,"Plain average (too little data)",[`Only ${nm.length} normal session(s) on record; 3 are needed. Treat this as a rough guess.`])}
 const sd=nm.filter(x=>x.day===day),useDay=o.dayOnly&&sd.length>=2,d=(useDay?sd:nm).map(x=>x.dem),k=Math.max(1,Math.min(+o.k||3,d.length)),st=[];let raw;
 if(o.method!=="hybrid")st.push(useDay?`Using ${d.length} normal ${day} sessions: [${d.join(", ")}]`:`Using all ${d.length} normal sessions${o.dayOnly?` (fewer than 2 ${day} rows, so the weekday filter is skipped)`:""}`);
 if(o.method==="avg"){raw=mean(d);st.push(`Average = ${raw.toFixed(1)}`)}
 else if(o.method==="ma"){const q=d.slice(-k);raw=mean(q);st.push(`Last ${q.length} values [${q.join(", ")}] average = ${raw.toFixed(1)}`)}
 else if(o.method==="wma"){const q=d.slice(-k),w=q.map((_,i)=>i+1),tw=w.reduce((x,y)=>x+y,0);raw=q.reduce((t,x,i)=>t+x*w[i],0)/tw;st.push(`Last ${q.length} values [${q.join(", ")}] with weights [${w.join(", ")}]: sum(value × weight) ÷ ${tw} = ${raw.toFixed(1)}`)}
 else{const ma=mean(nm.slice(-3).map(x=>x.dem));if(sd.length>=2){const m1=mean(sd.map(x=>x.dem));raw=(m1+ma)/2;st.push(`Same-weekday (${day}) average ${m1.toFixed(1)} and last-3 moving average ${ma.toFixed(1)} → (${m1.toFixed(1)} + ${ma.toFixed(1)}) ÷ 2 = ${raw.toFixed(1)}`)}else{raw=ma;st.push(`Fewer than 2 ${day} rows: last-3 moving average = ${raw.toFixed(1)}`)}}
 const a=dayAdj(h,id,type);raw*=a.k;st.push(a.txt+(a.k!==1?` Result × ${a.k.toFixed(2)} = ${raw.toFixed(1)}`:""));
 const sdv=sdev(d);return{v:Math.max(0,Math.round(raw)),lo:Math.max(0,Math.round(raw-sdv)),hi:Math.round(raw+sdv),n:rows.length,conf:sd.length>=3&&nm.length>=8?"good":"limited",method:MN[o.method]||MN.hybrid,steps:st}}
const base=(h,id)=>Math.round(mean(h.filter(x=>x.id===id&&!x.ev).map(x=>x.dem)));
/* WASTE: unsold = max(0, prepared - demand); shortage = max(0, demand - prepared); discarded (est.) = unsold x discard rate */
function wc(p,d){const u=Math.max(0,p-d),sh=Math.max(0,d-p),di=u*S.set.disc;return{u,sh,di,cost:di*S.set.cost,co2:di*S.set.co2}}

/* helpers */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));saveFail=false}catch(e){saveFail=true}}
function render(){if(S.role!=="authority"&&AUTH.includes(S.tab))S.tab="student";if(S.role==="authority"&&!TABS_AUTH.some(t=>t[0]===S.tab))S.tab="staff";const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;document.body.classList.toggle("pres",!!S.pres);$("app").innerHTML=(S.intro?introH():head()+VIEWS[S.tab]())+modalH();
 if(id&&$(id)){$(id).focus();try{$(id).setSelectionRange(pos,pos)}catch(e){}}
 if(S.focusD){const e=$("d-"+S.focusD);S.focusD=null;if(e)e.focus()}
 if(MODAL&&MODAL.focus){MODAL.focus=false;const e=$("pinin")||$("mno");if(e)e.focus()}}
const up=()=>{save();render()};
function f(k,v){S[k]=v;if(k==="tab"||k==="cat")S.msg=null;up()}
function say(k,t){S.msg={k,t};up()}
const msgH=()=>S.msg?`<div class="msg ${S.msg.k}" role="status">${esc(S.msg.t)}</div>`:"";
const num=v=>Math.max(0,Math.floor(+v||0)),fl=v=>Math.max(0,+v||0);
function tbl(h,rows){return`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function bars(labels,series){const W=640,H=230,L=34,B=34,mx=Math.max(1,...series.flatMap(s=>s.v)),g=(W-L)/labels.length,bw=g*.8/series.length;
 let o=`<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img">`;
 for(let i=0;i<=4;i++){const y=H-B-(H-B-10)*i/4;o+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#ece6f7"/><text x="2" y="${y+4}" font-size="10" fill="#6f6988">${Math.round(mx*i/4)}</text>`}
 labels.forEach((l,i)=>{series.forEach((s,j)=>{const h=(H-B-10)*s.v[i]/mx,x=L+i*g+g*.1+j*bw;o+=`<rect x="${x}" y="${H-B-h}" width="${bw}" height="${h}" rx="3" fill="${s.c}"><title>${s.n} - ${l}: ${s.v[i]}</title></rect>`});
  o+=`<text x="${L+i*g+g/2}" y="${H-16}" font-size="10" text-anchor="middle" fill="#3b3550">${esc(l)}</text>`});
 return o+`</svg><div class="muted">${series.map(s=>`<span style="color:${s.c}">■</span> ${s.n}`).join(" &nbsp; ")}</div>`}
const C=["#2f6b45","#8cc09d","#e07a1f","#b85410"];
const short=id=>nameOf(id).split(" ").slice(-1)[0];

/* actions */
const NX={Placed:"Preparing",Preparing:"Ready",Ready:"Completed"};
const adv=id=>{const o=S.orders.find(x=>x.id===id);o.st=NX[o.st];up()};
function setm(id,k,v){const m=S.menu.find(x=>x.id===id);if(k==="prep"){const sold=m.prep-m.stock;m.prep=num(v);m.stock=Math.max(0,m.prep-sold)}else if(k==="price")m.price=num(v);else m.on=v;up()}
function endSess(){ask("Close this session? Today's orders become history rows and the forecast will use them.",endSess2)}
function endSess2(){const t=todayISO(),due=S.orders.filter(o=>(o.odate||t)<=t),later=S.orders.filter(o=>(o.odate||t)>t),day=dayOf(S.date),qty=(a,id)=>a.reduce((x,o)=>x+(o.L.find(l=>l.id===id)?.q||0),0);let n=0,skip=0;
 S.menu.forEach(m=>{if(m.prep<=0){skip++;return}const known=m.dis!==null&&m.dis!==undefined&&m.dis!=="";
  S.hist.push({date:S.date,day,id:m.id,prep:m.prep,dem:qty(due,m.id),disc:known?Math.min(m.stock,num(m.dis)):Math.round(m.stock*S.set.disc),est:!known,ev:S.dtype!=="normal",type:S.dtype});
  m.stock=Math.max(0,m.prep-qty(later,m.id));m.dis=null;n++});
 S.orders=later;S.dtype="normal";S.date=nw(S.date);
 S.msg={k:"good",t:`Session saved to history for ${n} item(s). ${skip?skip+" out-of-stock item(s) were not recorded, because nothing was prepared and their demand is unknown. ":""}${later.length?later.length+" order(s) for later dates stay in the queue. ":""}Forecasts have been recalculated.`};up()}
function reset(){ask("Restore the original demonstration data? Your orders and changes will be lost.",()=>{const r=S.role;S=fresh();S.intro=false;S.role=r;S.tab=r==="authority"?"staff":"student";up()})}
const waitFor=o=>{if(o.st==="Ready"||o.st==="Completed")return null;const ah=S.orders.slice(0,S.orders.indexOf(o)).filter(x=>x.st==="Placed"||x.st==="Preparing"),it=ah.reduce((t,x)=>t+x.L.reduce((u,l)=>u+l.q,0),0)+o.L.reduce((u,l)=>u+l.q,0);return Math.ceil(ah.length*S.set.perOrder+it*S.set.minItem)};

/* views */
const TABS_STUDENT=[["student","🍽️ Menu"],["orders","🧾 My orders"],["about","ℹ️ About"]];
const TABS_AUTH=[["staff","📋 Staff"],["forecast","📈 Forecast"],["planner","♻️ Waste dashboard"],["sim","🎛️ Simulator"],["exp","🔬 Experiments"],["data","💾 Data"],["about","ℹ️ About"]];
const AUTH=TABS_AUTH.map(t=>t[0]).filter(t=>t!=="about");
/* Role switch. DEMO ONLY: the PIN is checked in the browser, so it is not real security. */
function setRole(r){
 if(r===S.role)return;
 if(r==="authority"&&S.role!=="authority"){MODAL={kind:"pin",err:"",focus:true};return render()}
 S.role=r;S.tab=r==="authority"?"staff":"student";S.msg=null;up()}
function pinGo(){const v=($("pinin").value||"").trim();
 if(v!==S.pin){MODAL.err="Incorrect PIN. Please try again, or cancel to stay in student view.";MODAL.focus=true;return render()}

 <h3>The problem</h3><p>Canteens may prepare too much or too little food when demand is difficult to predict. Too much leaves surplus; too little leaves students without food.</p>

 if(!L.length)return say("err","Your cart is empty. Only in-stock items can be ordered.");

 if(!nm)return say("err","Name is required. Please enter your name.");
 if(!validName(nm))return say("err","Please enter a valid name: 2 to 40 letters (spaces, full stops, hyphens and apostrophes are allowed).");
 if(!cls)return say("err","Class is required. Please choose your class.");
 if(!S.cfg.classes.includes(cls))return say("err","Please choose a class from the list.");
 if(!sec)return say("err","Section is required. Please choose your section.");
 if(!S.cfg.sections.includes(sec))return say("err","Please choose a section from the list.");
 if(!SLOTS.includes(slot))return say("err","Please choose a pickup time: short break or lunch break.");
 const tot=L.reduce((t,l)=>t+l.q*l.p,0);if(!Number.isFinite(tot)||tot<0)return say("err","The order total is invalid.");
 const snap=JSON.stringify(S);
 L.forEach(l=>{S.menu.find(x=>x.id===l.id).stock-=l.q});
 const o={id:"CIQ-"+S.next++,name:nm,cls,sec,odate:S.od,L,tot,slot,st:"Placed",created:new Date().toISOString()};S.orders.push(o);S.cart={};S.last=o.id;S.msg=null;
 if(!saveOk()){S=Object.assign(fresh(),JSON.parse(snap));return say("err","The order could NOT be saved to this browser (storage may be full or blocked), so it was not placed. Free some space or export a backup, then try again.")}
 render()}
const confirmCard=o=>`<div class="card" role="status"><div class="row between"><h2>✅ Order ${esc(o.id)} saved</h2><button class="sm" onclick="S.last=null;up()">Place another</button></div>${tbl(["Order ID","Name","Order date","Class","Section","Pickup time","Status"],[[esc(o.id),esc(o.name||"-"),esc(fmtDate(o.odate)),esc(o.cls||"-"),esc(o.sec||"-"),esc(o.slot),`<span class="pill ${o.st}">${o.st}</span>`]])}${tbl(["Item","Quantity","Price each","Line total"],o.L.map(l=>[esc(l.name),l.q,"₹"+l.p,"₹"+l.q*l.p]).concat([["<b>Total (demonstration)</b>","","","<b>₹"+o.tot+"</b>"]]))}<p class="muted">Demonstration only: no real payment is collected. Orders are stored only in this browser on this computer and are not shared with other devices or a real canteen.</p></div>`;
VIEWS.student=function(){if(!inWindow(S.od))S.od=todayISO();if(!SLOTS.includes(S.sl))S.sl="";const avail=m=>m.on&&m.stock>0;
 for(const id in S.cart){const m=S.menu.find(x=>x.id===id);if(!m||!avail(m))delete S.cart[id]}
 const ms=S.menu.filter(m=>(S.cat==="All"||m.cat===S.cat)&&m.name.toLowerCase().includes(S.q.toLowerCase())),cl=S.menu.filter(m=>(S.cart[m.id]||0)>0),tot=cl.reduce((t,m)=>t+m.price*S.cart[m.id],0),lo=S.last&&S.orders.find(o=>o.id===S.last),
 opt=(a,v,ph)=>`<option value="">${ph}</option>`+a.map(x=>`<option ${v===x?"selected":""}>${esc(x)}</option>`).join("");
 return(lo?confirmCard(lo):"")+`<div class="layout"><section><div class="row" style="margin-bottom:1rem"><input id="q" placeholder="Search menu…" aria-label="Search menu" value="${esc(S.q)}" oninput="S.q=this.value;render()">${["All","Snacks","Meals","Beverages"].map(c=>`<button class="sm ${S.cat===c?"on":""}" onclick="f('cat','${c}')">${c}</button>`).join("")}</div>
 ${ms.length?"":'<p class="muted">No items match your search.</p>'}<div class="grid">${ms.map(m=>{const ok=avail(m);return`<div class="card ${m.cat}${ok?"":" oos"}"><span class="emoji">${m.emoji}</span><h3>${esc(m.name)}</h3><div class="muted">${esc(m.desc)}</div><div class="row between" style="margin:.5rem 0"><b>₹${m.price}</b><span class="pill ${ok?"stk-in":"stk-out"}">${!m.on?"Out of stock (off menu)":ok?"In stock · "+m.stock+" left":"Out of stock"}</span></div><button class="go" style="width:100%" ${ok&&(S.cart[m.id]||0)<Math.min(m.stock,MAXQ)?"":"disabled"} onclick="addq('${m.id}',${(S.cart[m.id]||0)+1})">${ok?"Add to cart":"Out of stock"}</button></div>`}).join("")}</div>
 <p class="muted">Demonstration menu and prices. This is not the school's real canteen menu, and stock here is a simulation, not the school's physical stock.</p></section>
 <aside class="card" style="align-self:start"><h2>🛒 Your order</h2>${cl.length?"":'<p class="muted">Nothing added yet. Only in-stock items can be ordered.</p>'}${cl.map(m=>`<div class="row between" style="margin-bottom:.4rem"><span>${m.emoji} ${esc(m.name)} <span class="muted">₹${m.price} each</span></span><span class="row"><button type="button" class="sm" aria-label="Decrease ${esc(m.name)}" onclick="addq('${m.id}',${S.cart[m.id]-1})">−</button><b>${S.cart[m.id]}</b><button type="button" class="sm" aria-label="Increase ${esc(m.name)}" onclick="addq('${m.id}',${S.cart[m.id]+1})" ${S.cart[m.id]>=Math.min(m.stock,MAXQ)?"disabled":""}>+</button><button type="button" class="sm warn" aria-label="Remove ${esc(m.name)}" onclick="addq('${m.id}',0)">✕</button></span></div>`).join("")}
 <p><b>Total: ₹${tot}</b> <span class="muted">(demonstration)</span></p>
 <h3>Order date *</h3><p class="muted">You can book from today (${esc(fmtDate(todayISO()))}) up to ${esc(fmtDate(maxISO()))}: a rolling one-month window.</p>${calHTML()}<p><b>Selected:</b> ${esc(fmtDate(S.od))}</p>
 <label class="ctl">Your name *<input id="nm" type="text" required aria-required="true" maxlength="40" autocomplete="off" placeholder="First and last name" value="${esc(S.nm||"")}" oninput="S.nm=this.value;save()" onchange="up()"></label>
 <label class="ctl">Class *<select id="cls" required aria-required="true" onchange="S.cls=this.value;up()">${opt(S.cfg.classes,S.cls,"Select class…")}</select></label>
 <label class="ctl">Section *<select id="sec" required aria-required="true" onchange="S.sec=this.value;up()">${opt(S.cfg.sections,S.sec,"Select section…")}</select></label>
 <label class="ctl">Pickup time * <span class="muted">(break times only)</span><select id="slt" required aria-required="true" onchange="S.sl=this.value;up()">${opt(SLOTS,S.sl,"Choose pickup time…")}</select></label>
 <div class="box muted"><b>Summary</b><br>Name: ${esc(cleanName(S.nm)||"-")}<br>Pickup: ${esc(S.sl||"-")}<br>Date: ${esc(fmtDate(S.od))}<br>Class ${esc(S.cls||"-")}, Section ${esc(S.sec||"-")}<br>Items: ${cl.reduce((t,m)=>t+S.cart[m.id],0)} · Total ₹${tot}</div>
 ${msgH()}<button class="go" style="width:100%" ${cl.length?"":"disabled"} onclick="place()">Place simulated order</button>
 <p class="muted">Demonstration only: no real payment is taken. Your name, class and section are saved with the order only in this browser on this computer, and are not shared with other devices. No phone number or other contact details are collected.</p></aside></div>`};
VIEWS.orders=function(){const m=S.orders.filter(o=>o.id.toLowerCase().includes(S.lk.toLowerCase()));
 return msgH()+`<div class="card"><div class="row between"><h2>My orders</h2><input id="lk" placeholder="Filter by order ID" aria-label="Filter by order ID" value="${esc(S.lk)}" oninput="S.lk=this.value;render()"></div>${m.length?tbl(["Order","Name","Order date","Class","Section","Items (price each)","Total","Pickup time","Status","Est. wait*"],m.map(o=>{const w=waitFor(o);return[`<b>${esc(o.id)}</b>`,esc(o.name||"-"),esc(fmtDate(o.odate||todayISO())),esc(o.cls||"-"),esc(o.sec||"-"),o.L.map(l=>esc(l.q+"× "+l.name+" @ ₹"+l.p)).join(", "),"₹"+o.tot,esc(o.slot),`<span class="pill ${o.st}">${o.st}</span>`,w===null?"-":"~"+w+" min"]})):'<p class="muted">No orders yet. Place one from the menu.</p>'}<p class="muted">*Estimate = orders ahead × ${S.set.perOrder} min + items × ${S.set.minItem} min. Not a live prediction: no real preparation times are measured. All orders are demonstrations, stored only in this browser on this computer, not shared with other devices.</p></div>`};
const parseList=t=>[...new Set(String(t).split(",").map(x=>x.trim().replace(/[<>"&]/g,"").slice(0,12)).filter(Boolean))].slice(0,20);
function saveCfg(){const c=parseList($("cfgC").value),s=parseList($("cfgS").value);if(!c.length||!s.length)return say("err","Class and section lists each need at least one value.");
 S.cfg={classes:c,sections:s};if(!c.includes(S.cls))S.cls="";if(!s.includes(S.sec))S.sec="";say("good","Order-form options saved.")}
function restoreMenu(){ask("Restore the demonstration menu? Chocolate becomes available and every other item becomes out of stock. Orders and history are kept.",()=>{S.cart={};S.menu=freshMenu();say("good","Demonstration menu restored: Chocolate in stock, all other items out of stock.")})}

render();
</script></body></html>
